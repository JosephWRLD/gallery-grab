name: Galeri kataloğunu güncelle

on:
  schedule:
    - cron: '0 18 * * *'   # her gün 21:00 (Türkiye, UTC+3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-sets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kataloğu üret
        run: node tools/build-gallery-sets.mjs
      - name: Değiştiyse commit et
        run: |
          if git diff --quiet -- data/gallery-sets.json; then
            echo "Katalog değişmedi"
            exit 0
          fi
          git config user.name "JosephWRLD"
          git config user.email "76696237+JosephWRLD@users.noreply.github.com"
          git add data/gallery-sets.json
          git commit -m "Galeri kataloğu: $(date -u +%Y-%m-%d)"
          # aynı anda başka bir push olduysa üstüne al (reddedilmesin)
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
