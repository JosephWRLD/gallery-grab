<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gallery Grab</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --tx:#e7e9ee; --mut:#8b93a3; --acc:#2fd08a; --warn:#f0b43c; --err:#ef5a5a; }
  * { box-sizing: border-box; }
  body { margin:0; width:380px; background:var(--bg); color:var(--tx); font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  header img { width:22px; height:22px; border-radius:4px; }
  header b { flex:1; }
  section { padding:10px 12px; border-bottom:1px solid var(--line); }
  input, textarea { width:100%; background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  textarea { height:64px; resize:vertical; }
  button { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--mut); }
  button.pri { background:var(--acc); color:#06140d; border-color:var(--acc); font-weight:600; }
  button.dan { background:var(--err); color:#fff; border-color:var(--err); font-weight:600; }
  .row { display:flex; gap:6px; align-items:center; }
  .row > input { flex:1; }
  .mut { color:var(--mut); font-size:12px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:8px; }
  .stats div { background:var(--card); border-radius:6px; padding:6px; text-align:center; }
  .stats b { display:block; font-size:14px; }
  #status { margin-top:6px; font-size:12px; }
  #status.error { color:var(--err); } #status.warn { color:var(--warn); } #status.ok { color:var(--acc); }
  #results { max-height:150px; overflow:auto; margin-top:6px; }
  #results div { padding:5px 6px; border-radius:4px; cursor:pointer; }
  #results div:hover { background:var(--card); }
  #list { max-height:230px; overflow:auto; }
  .it { display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid var(--line); }
  .it .n { flex:1; min-width:0; }
  .it .n small { display:block; color:var(--mut); }
  .it .x { padding:2px 7px; }
  .tag { font-size:11px; padding:2px 6px; border-radius:10px; background:var(--card); white-space:nowrap; }
  .tag.done { color:var(--acc); } .tag.budget, .tag.notfound { color:var(--warn); } .tag.error { color:var(--err); }
  #missing { color:var(--err); font-size:12px; margin-top:4px; }
  /* Web App sol menüsünden iframe içinde açılınca */
  body.embedded { width:100%; min-height:100vh; }
  body.embedded header { display:none; }
  body.embedded main { max-width:760px; margin:0 auto; padding:12px 0; }
  body.embedded #results { max-height:260px; }
  body.embedded #list { max-height:none; }
</style>
</head>
<body>
<header><img src="icons/logo.png" alt=""><b>Gallery Grab</b><span class="mut" id="count"></span></header>
<main>

<section>
  <div class="stats">
    <div><span class="mut">Coin</span><b id="coins">—</b></div>
    <div><span class="mut">Harcanan</span><b id="spent">0</b></div>
    <div><span class="mut">Kalan bütçe</span><b id="left">—</b></div>
  </div>
  <div class="row">
    <input id="budget" type="number" min="0" step="100" placeholder="Toplam bütçe (coin, 0 = sınırsız)">
    <button id="toggle" class="pri">Başlat</button>
  </div>
  <div id="status" class="mut">Hazır</div>
</section>

<section>
  <div class="row"><input id="q" placeholder="Oyuncu ara (ör. Mbappé)"></div>
  <div id="results"></div>
  <details style="margin-top:8px">
    <summary class="mut">Toplu ekle (her satıra bir isim)</summary>
    <textarea id="bulk" placeholder="Salah&#10;Arda Güler&#10;Kerem Aktürkoğlu"></textarea>
    <div class="row" style="margin-top:6px"><button id="bulkBtn">Listeye ekle</button></div>
    <div id="missing"></div>
  </details>
</section>

<section>
  <div id="list"></div>
  <div class="row" style="margin-top:8px">
    <button id="retry">Atlananları tekrar dene</button>
    <button id="resetSpent">Harcananı sıfırla</button>
    <button id="clear">Listeyi temizle</button>
  </div>
</section>
</main>

<script type="module" src="popup.js"></script>
</body>
</html>
